<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Unbreakable Sole">
  <defs>
    <clipPath id="us-clip"><rect width="64" height="64" rx="14"/></clipPath>
    <!-- radial profile sampled from the logo's sun (wordmark pixel 231,20) -->
    <radialGradient id="us-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="30%"  stop-color="#fffff8"/>
      <stop offset="40%"  stop-color="#fef9e4"/>
      <stop offset="50%"  stop-color="#fff0cf"/>
      <stop offset="60%"  stop-color="#fbe1b1"/>
      <stop offset="70%"  stop-color="#f1ca8a"/>
      <stop offset="80%"  stop-color="#e8b66c"/>
      <stop offset="90%"  stop-color="#cf9b4f"/>
      <stop offset="100%" stop-color="#b8874a"/>
    </radialGradient>
    <radialGradient id="us-halo" cx="50%" cy="50%" r="50%">
      <stop offset="54%"  stop-color="#f0b760" stop-opacity=".62"/>
      <stop offset="65%"  stop-color="#f0b760" stop-opacity=".34"/>
      <stop offset="75%"  stop-color="#f0b760" stop-opacity=".16"/>
      <stop offset="87%"  stop-color="#f0b760" stop-opacity=".04"/>
      <stop offset="100%" stop-color="#f0b760" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#us-clip)">
    <rect width="64" height="64" fill="#d7e8f3"/>
    <circle cx="32" cy="32" r="35.5" fill="url(#us-halo)"/>
    <circle cx="32" cy="32" r="19.2" fill="url(#us-sun)"/>
  </g>
</svg>
